[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stm32-ecra"
version = "0.1.0"
description = "STM32 global/static inventory and concurrency evidence analyzer"
requires-python = ">=3.10"
dependencies = ["libclang==18.1.1", "PyYAML>=6.0.2,<7"]

[project.scripts]
ecra = "ecra.cli:main"
ecra-studio = "ecra.studio.__main__:main"

[project.optional-dependencies]
studio = ["fastapi==0.136.3", "uvicorn==0.49.0", "ruamel.yaml==0.18.16", "ruamel.yaml.clib==0.2.12"]

[tool.setuptools.package-data]
ecra = ["studio/web/*", "studio/web/assets/*", "studio/web/licenses/*", "studio/sample_assets/*"]

[tool.setuptools.packages.find]
include = ["ecra*"]
