# 裸机 CMake 工程：编辑一次配置，之后只运行 ecra。
# 相对路径以固件根目录为基准。变量无需逐个填写。
version: 1
project:
  chip: STM32
  core: Cortex-M
  native_word_bits: 32
analysis:
  # 只排查这些目录中定义的变量；多个目录取并集，递归包含子目录。
  include_dirs: ["Core/Src", "Core/Inc"]  # 例如 [Core/Src, Core/Inc, App]
  exclude_dirs: [Drivers, Middlewares, ThirdParty, build, .ecra]
  exclude_files: [Core/Src/system_stm32f1xx.c, Core/Src/syscalls.c, Core/Src/sysmem.c]  # 例如 [Core/Src/system_stm32f1xx.c, Core/Src/sysmem.c]
  cmake:
    build_dir: build/ecra
    generator: Ninja
    build_type: Debug
    toolchain_file: "cmake/arm-none-eabi-toolchain.cmake"
    args: []  # 原工程需要的 -D 选项；每项是一个参数
    build: true  # 每次先配置并增量构建，再扫描；不会烧录
  auto_system_includes: true  # 自动探测 Arm GCC 标准头文件目录
  output_dir: .ecra
  # open_report: true  # 完成后用默认浏览器打开变量报告
contexts:
  - id: main
    kind: MAIN
    functions: [main]
# 无参数 IRQHandler 自动识别，HAL 回调沿实际调用链继承上下文。
# 不能由源码恢复的动态 ISR/回调注册可使用 entry_registrations 声明。
review:
  enabled: true  # 默认本地静态排查；需要 OpenCode 复核时改为 true
  command: [opencode]
  # model: provider/model
  timeout_seconds: 300
  retries: 1
  max_items: 0
